<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Makes the vendored Archivo faces visible to OpenSCAD's text().

     OpenSCAD resolves fonts only through fontconfig; its own OPENSCADPATH
     font directory is not consulted. Point FONTCONFIG_FILE at this file and
     the two faces below join the system set. dir prefix="relative" resolves
     against this file's own directory, so the checkout can live anywhere. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
