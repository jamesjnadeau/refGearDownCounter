<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-9ebe2a2c-8d74-40ca-927a-ac714ddebfca/styles.css">
<script src="_ds/modernist-9ebe2a2c-8d74-40ca-927a-ac714ddebfca/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<div style="width:3.125in;height:4.8125in;box-sizing:border-box;border:2px solid #000;background:#fff;color:#000;font-family:Archivo,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact">

  <div style="display:flex;align-items:stretch;border-bottom:2px solid #000;flex:0 0 auto">
    <div style="flex:0 0 auto;background:#000;color:#fff;padding:6px 8px 5px;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:13px;font-weight:800;letter-spacing:0.06em;line-height:1">{{ team }}</div>
    </div>
    <div style="flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;padding:5px 7px 4px;min-width:0">
      <div style="font-size:7px;font-weight:700;letter-spacing:0.14em">TEAM</div>
      <div style="height:13px;border-bottom:1px solid #000"></div>
    </div>
  </div>

  <div style="display:flex;align-items:flex-end;border-bottom:2px solid #000;flex:0 0 auto;padding:5px 7px 4px;gap:6px">
    <div style="flex:0 0 auto;font-size:8px;font-weight:800;letter-spacing:0.1em;padding-bottom:1px">COACH</div>
    <div style="flex:1 1 0;min-width:0">
      <div style="height:13px;border-bottom:1px solid #000"></div>
    </div>
  </div>

  <sc-if value="{{ showToss }}" hint-placeholder-val="{{ true }}">
  <div style="border-bottom:2px solid #000;flex:0 0 auto;padding:6px 7px 7px">
    <div style="font-size:7px;font-weight:800;letter-spacing:0.16em;margin-bottom:5px">COIN TOSS</div>
    <div style="display:flex;gap:7px;align-items:flex-end">
      <div style="flex:0 0 108px;min-width:0;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;align-items:center;gap:5px">
          <div style="flex:0 0 32px;white-space:nowrap;font-size:7px;font-weight:700;letter-spacing:0.1em">CALL</div>
          <div style="flex:1 1 0;min-width:0;display:flex;gap:3px">
            <div style="flex:1 1 0;border:1px solid #000;font-size:7px;font-weight:700;text-align:center;padding:3px 0;flex-basis:26px;flex-grow:0">H</div>
            <div style="flex:1 1 0;border:1px solid #000;font-size:7px;font-weight:700;text-align:center;padding:3px 0;flex-basis:26px;flex-grow:0">T</div>
          </div>
        </div>
        <div>
          <div style="font-size:7px;font-weight:700;letter-spacing:0.12em">WON BY</div>
          <div style="height:15px;border-bottom:1px solid #000"></div>
        </div>
      </div>
      <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;align-items:center;gap:5px">
          <div style="flex:0 0 26px;white-space:nowrap;font-size:7px;font-weight:700;letter-spacing:0.1em">1ST</div>
          <div style="flex:1 1 0;min-width:0;display:flex;gap:3px">
            <div style="flex:0 0 34px;border:1px solid #000;font-size:7px;font-weight:700;text-align:center;padding:3px 0">REC</div>
            <div style="flex:0 0 34px;border:1px solid #000;font-size:7px;font-weight:700;text-align:center;padding:3px 0">DFER</div>
            <div style="flex:1 1 0;min-width:0;align-self:flex-end;height:15px;border-bottom:1px solid #000"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:5px">
          <div style="flex:0 0 26px;white-space:nowrap;font-size:7px;font-weight:700;letter-spacing:0.1em">2ND</div>
          <div style="flex:1 1 0;min-width:0;display:flex;gap:3px">
            <div style="flex:0 0 34px;border:1px solid #000;font-size:7px;font-weight:700;text-align:center;padding:3px 0">REC</div>
            <div style="flex:0 0 34px;border:1px solid #000;font-size:7px;font-weight:700;text-align:center;padding:3px 0">DFER</div>
            <div style="flex:1 1 0;min-width:0;align-self:flex-end;height:15px;border-bottom:1px solid #000"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </sc-if>

  <div style="flex:0 0 auto;padding:6px 7px 7px;border-bottom:2px solid #000">
    <div style="font-size:7px;font-weight:800;letter-spacing:0.16em;margin-bottom:5px">TIME OUTS</div>
    <div style="display:flex;gap:6px;align-items:stretch">
      <div style="flex:0 0 22px;display:flex;align-items:center;font-size:8px;font-weight:800;letter-spacing:0.04em">1H</div>
      <div style="flex:1 1 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px">
        <div style="border:1.5px solid #000;height:36px;display:flex">
          <div style="flex:0 0 22px;border-right:1px solid #000;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 2px;border-bottom:1px solid #000">QTR</div>
            <div style="flex:1 1 0"></div>
          </div>
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 3px;border-bottom:1px solid #000">TIME</div>
            <div style="flex:1 1 0"></div>
          </div>
        </div>
        <div style="border:1.5px solid #000;height:36px;display:flex">
          <div style="flex:0 0 22px;border-right:1px solid #000;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 2px;border-bottom:1px solid #000">QTR</div>
            <div style="flex:1 1 0"></div>
          </div>
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 3px;border-bottom:1px solid #000">TIME</div>
            <div style="flex:1 1 0"></div>
          </div>
        </div>
        <div style="border:1.5px solid #000;height:36px;display:flex">
          <div style="flex:0 0 22px;border-right:1px solid #000;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 2px;border-bottom:1px solid #000">QTR</div>
            <div style="flex:1 1 0"></div>
          </div>
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 3px;border-bottom:1px solid #000">TIME</div>
            <div style="flex:1 1 0"></div>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:stretch;margin-top:5px">
      <div style="flex:0 0 22px;display:flex;align-items:center;font-size:8px;font-weight:800;letter-spacing:0.04em">2H</div>
      <div style="flex:1 1 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px">
        <div style="border:1.5px solid #000;height:36px;display:flex">
          <div style="flex:0 0 22px;border-right:1px solid #000;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 2px;border-bottom:1px solid #000">QTR</div>
            <div style="flex:1 1 0"></div>
          </div>
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 3px;border-bottom:1px solid #000">TIME</div>
            <div style="flex:1 1 0"></div>
          </div>
        </div>
        <div style="border:1.5px solid #000;height:36px;display:flex">
          <div style="flex:0 0 22px;border-right:1px solid #000;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 2px;border-bottom:1px solid #000">QTR</div>
            <div style="flex:1 1 0"></div>
          </div>
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 3px;border-bottom:1px solid #000">TIME</div>
            <div style="flex:1 1 0"></div>
          </div>
        </div>
        <div style="border:1.5px solid #000;height:36px;display:flex">
          <div style="flex:0 0 22px;border-right:1px solid #000;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 2px;border-bottom:1px solid #000">QTR</div>
            <div style="flex:1 1 0"></div>
          </div>
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
            <div style="flex:0 0 auto;font-size:7px;font-weight:700;letter-spacing:0.04em;padding:1px 3px;border-bottom:1px solid #000">TIME</div>
            <div style="flex:1 1 0"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="flex:1 1 auto;display:flex;flex-direction:column;min-height:0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 7px 4px;flex:0 0 auto">
      <div style="font-size:7px;font-weight:800;letter-spacing:0.16em">{{ scoringLabel }}</div>
      <div style="font-size:7px;font-weight:600;letter-spacing:0.06em">TD 6 · FG 3 · PAT 1 · 2PT 2 · SAF 2</div>
    </div>
    <div style="display:grid;grid-template-columns:30px 44px minmax(0,1fr) minmax(0,1fr);border-top:1.5px solid #000;border-bottom:1px solid #000;flex:0 0 auto;background:#000;color:#fff">
      <div style="font-size:7px;font-weight:700;text-align:center;padding:3px 0;letter-spacing:0.08em">QTR</div>
      <div style="font-size:7px;font-weight:700;text-align:center;padding:3px 0;letter-spacing:0.08em">TIME</div>
      <div style="font-size:7px;font-weight:700;text-align:center;padding:3px 0;letter-spacing:0.08em">POINTS</div>
      <div style="font-size:7px;font-weight:700;text-align:center;padding:3px 0;letter-spacing:0.08em">TOTAL</div>
    </div>
    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="10">
      <div style="display:grid;grid-template-columns:30px 44px minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid #000;flex:1 1 0;min-height:0">
        <div style="border-right:1px solid #000"></div>
        <div style="border-right:2px solid #000"></div>
        <div style="border-right:2px solid #000"></div>
        <div></div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;3.125in&quot;,&quot;height&quot;:&quot;4.8125in&quot;},&quot;team&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HOME&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;oppLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;VISITOR&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showToss&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const team = this.props.team ?? "HOME";
    return {
      team,
      scoringLabel: (this.props.scoringLabel ?? (team + " SCORING")),
      oppLabel: this.props.oppLabel ?? "VISITOR",
      showToss: this.props.showToss ?? true,
      rows: Array.from({ length: this.props.rowCount ?? 10 }, (_, i) => i)
    };
  }
}

</script>
</body>
</html>
